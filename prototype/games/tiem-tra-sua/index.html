  <style>
    :root {
      --navy: #16202d; --navy2: #1f2c3c; --cream: #fff2dc; --cream2: #f7e4c4; --cream3: #efd5aa; --ink: #3b2618; --ink2: #6b4a33;
      --caramel: #80543a; --teal: #29625c; --teal2: #347a72; --teal-l: #d6ebe4; --sage: #83a28a; --amber: #e8a64f; --amber-l: #ffe3b0;
      --plum: #71364e; --red: #b8463c; --red-l: #f6d3cc; --shadow: 0 6px 18px rgba(10, 14, 22, .28), 0 1px 0 rgba(255, 255, 255, .5) inset;
      --r: 14px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; }
    body { background: radial-gradient(120% 80% at 50% 0%, #243447 0%, var(--navy) 60%) var(--navy); color: var(--cream); font: 500 15px/1.45 "Be Vietnam Pro", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent; min-height: 100svh; display: flex; flex-direction: column; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

    .top { flex: none; display: flex; align-items: center; gap: 12px; padding: 6px 14px; min-height: 52px; background: rgba(15, 22, 31, .85); border-bottom: 1px solid rgba(255, 255, 255, .06); }
    .top a { color: var(--cream3); text-decoration: none; font-weight: 700; padding: 10px 4px; }
    .top h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: .01em; }
    .top .shop { color: var(--amber-l); font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .top .tools { margin-left: auto; display: flex; gap: 8px; }
    .tbtn { min-height: 40px; padding: 6px 12px; border-radius: 12px; border: 1px solid rgba(255, 242, 220, .18); background: rgba(255, 242, 220, .08); cursor: pointer; font-weight: 700; font-size: 13px; }
    .tbtn:hover { background: rgba(255, 242, 220, .16); }
    .tbtn:disabled { opacity: .45; cursor: default; }

    .app { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 410px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "world brew" "rail brew";
      gap: 12px; padding: 12px; min-height: 0; height: calc(100svh - 52px); opacity: 0; transition: opacity .3s; }
    .app.ready { opacity: 1; }
    .world { grid-area: world; position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: calc(100svh - 52px - 24px - 132px - 12px); border-radius: 18px; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 255, 255, .06); background: #2b1d14; }
    .scene { position: absolute; inset: 0; overflow: hidden; }
    .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; image-rendering: pixelated; }
    .stage .layer { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; image-rendering: pixelated; pointer-events: none; user-select: none; }
    .spr { position: absolute; background-repeat: no-repeat; image-rendering: pixelated; }
    .stage.smooth, .stage.smooth .layer, .stage.smooth .spr, .stage.smooth i { image-rendering: auto; }
    .stage > .spr { pointer-events: none; }
    .barista { z-index: 1; }
    .owned, .owned .spr, .decor { pointer-events: none; }
    .decor { position: absolute; }
    .minicup { position: absolute; width: 48px; height: 58px; pointer-events: none; }
    .minicup i { position: absolute; left: 0; top: 0; background-repeat: no-repeat; image-rendering: pixelated; }
    .crowd { position: absolute; inset: 0; }
    .cust { border: 0; padding: 0; margin: 0; background-color: transparent; cursor: default; touch-action: manipulation; }
    .cust.can-pin { cursor: pointer; }
    .cust.can-pin:hover, .cust.can-pin:focus-visible { filter: drop-shadow(0 0 2px #fff6d6) drop-shadow(0 0 6px rgba(255, 220, 140, .9)); outline: none; }
    .cust.active { filter: drop-shadow(0 0 2px #9ff0dc) drop-shadow(0 0 8px rgba(80, 200, 170, .9)); }
    .cust.flip { transform: scaleX(-1); }
    .fx { position: absolute; inset: 0; pointer-events: none; z-index: 900; }
    .scene-ui { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
    .bubble { position: absolute; transform: translate(-50%, -100%); max-width: 230px; width: max-content; background: var(--cream); color: var(--ink); border-radius: 14px; padding: 7px 11px; font-size: 13px; font-weight: 600; line-height: 1.35;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .3); }
    .bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: var(--cream); }
    .bubble.left { transform: translate(-82%, -100%); }
    .bubble.left::after { left: 82%; }
    .bubble.pop { animation: pop .28s ease-out; }
    @keyframes pop { from { opacity: 0; translate: 0 6px; scale: .92; } }
    .pbar { position: absolute; width: 58px; height: 8px; transform: translateX(-50%); background: rgba(22, 32, 45, .6); border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1.5px rgba(255, 242, 220, .7); }
    .pbar i { display: block; height: 100%; width: 100%; background: #7fc08d; border-radius: 6px; transition: width .2s linear; }
    .pbar.mid i { background: var(--amber); }
    .pbar.low i { background: #e0604f; }
    .ctag { position: absolute; transform: translate(-50%, -100%); font-size: 11px; font-weight: 700; color: var(--cream); background: rgba(22, 32, 45, .72); padding: 1px 7px; border-radius: 8px; white-space: nowrap; }
    .ctag.on { background: var(--teal); }

    .hud { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 10; pointer-events: none; }
    .chip { display: flex; align-items: center; gap: 6px; background: rgba(255, 242, 220, .95); color: var(--ink); border-radius: 12px; padding: 3px 10px 3px 5px; box-shadow: 0 3px 10px rgba(0, 0, 0, .25); }
    .chip b { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .chip small { font-size: 11px; color: var(--ink2); font-weight: 600; }
    .chip.low { background: var(--red-l); box-shadow: 0 0 0 2px #c0392b, 0 3px 10px rgba(0, 0, 0, .25); cursor: pointer; }
    .chip.low small { color: #8a1f14; font-weight: 800; }
    #hStock { cursor: pointer; }
    .stock-warn { border: 2px solid #c0392b; background: #fff1ec; }
    .stock-warn h3 { color: #8a1f14; }
    .warn-list { list-style: none; margin: 6px 0 10px; padding: 0; display: grid; gap: 4px; }
    .warn-list li { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .warn-list li.zero span { font-weight: 800; color: #8a1f14; }
    .warn-txt { font-weight: 800; color: #8a1f14; flex: 1 1 200px; }
    .quickstock .stock { margin: 8px 0 12px; }
    .fair, .challenge { border: 2px solid var(--teal, #2c6e66); }
    .ch-week { list-style: none; padding: 0; margin: 6px 0 10px; display: grid; gap: 4px; }
    .ch-week li { display: grid; gap: 1px; padding: 4px 8px; border-radius: 8px; background: rgba(0, 0, 0, .04); font-size: 13px; }
    .ch-week li.today { background: var(--amber-l); }
    .badge-tag { display: inline-block; font-size: 11px; font-weight: 800; background: var(--plum); color: #fff; border-radius: 6px; padding: 1px 7px; margin: 2px 4px 2px 0; }
    .badges-new { margin: 6px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
    .badge-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 10px; }
    .badge-wall h3 { grid-column: 1 / -1; margin: 0; }
    .bw-item { padding: 6px 8px; border-radius: 8px; background: rgba(0, 0, 0, .05); opacity: .6; display: grid; gap: 2px; }
    .bw-item.on { background: var(--amber-l); opacity: 1; }
    .bw-item small { font-size: 11px; }
    .levelup.miss { background: var(--red-l); }
    /* thời tiết (render/scene.js setWeather): sheet weather-fx.webp nếu có, ngược lại lớp CSS */
    .wx { position: absolute; inset: 0; pointer-events: none; z-index: 5000; }
    .wx-art { position: absolute; left: 0; top: 0; image-rendering: pixelated; }
    .wx.css .wx-art { display: none; }
    .wx.css.wx-rain { background: linear-gradient(rgba(30, 40, 60, .28), rgba(30, 40, 60, .28)), repeating-linear-gradient(105deg, rgba(200, 220, 255, .0) 0 22px, rgba(200, 220, 255, .38) 22px 24px); background-size: auto, 260px 260px; animation: wxRain .5s linear infinite; }
    .wx.css.wx-power { background: radial-gradient(ellipse at 45% 55%, rgba(255, 220, 140, .18), rgba(5, 8, 18, .72) 60%); }
    @keyframes wxRain { to { background-position: 0 0, -60px 260px; } }
    @media (prefers-reduced-motion: reduce) { .wx.css.wx-rain { animation: none; } }
    .chip.warn { background: var(--amber-l); animation: pulse 1s ease-in-out infinite; }
    .xpbar { width: 54px; height: 6px; border-radius: 4px; background: var(--cream3); overflow: hidden; }
    .xpbar i { display: block; height: 100%; background: var(--teal); }
    @keyframes pulse { 50% { box-shadow: 0 0 0 3px rgba(232, 166, 79, .55); } }
    .ico { display: inline-block; flex: none; background-repeat: no-repeat; image-rendering: pixelated; vertical-align: middle; }
    .ico.off { opacity: .25; filter: grayscale(1); }
    /* sheet tải khi cần (chân dung hội thoại…): ô giữ đúng cỡ, nền mờ nhấp nháy tới khi ảnh về */
    .ico.loading { background-color: rgba(120, 86, 52, .16); border-radius: 8px; animation: icoLoad .9s ease-in-out infinite alternate; }
    @keyframes icoLoad { from { opacity: .45; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .ico.loading { animation: none; } }

    .rail { grid-area: rail; display: flex; gap: 10px; overflow-x: auto; align-items: stretch; padding: 2px 2px 6px; min-height: 0; scrollbar-width: thin; }
    .rail-empty { margin: auto 0; color: var(--cream3); opacity: .8; padding: 0 6px; }
    .slip { flex: none; width: 178px; min-height: 108px; text-align: left; border: 0; border-radius: var(--r); background: var(--cream); color: var(--ink); padding: 8px 10px 8px; cursor: pointer;
      box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; position: relative; transition: translate .15s, box-shadow .15s; }
    .slip:hover:not(:disabled) { translate: 0 -2px; }
    .slip:disabled { opacity: .7; cursor: default; }
    .slip.on { box-shadow: 0 0 0 3px var(--teal), var(--shadow); }
    .slip-top { display: flex; gap: 8px; align-items: center; }
    .slip-tx { display: grid; line-height: 1.2; min-width: 0; }
    .slip-tx b { font-size: 14px; }
    .slip-tx span { font-size: 13px; color: var(--ink2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slip-spec { font-size: 12px; font-weight: 700; color: var(--caramel); }
    .slip .pbar { position: static; transform: none; width: 100%; box-shadow: none; background: var(--cream3); }
    .slip-state { font-style: normal; font-size: 12px; font-weight: 700; color: var(--teal); }
    .face { border-radius: 10px; background-color: var(--cream3); }

    .brew { grid-area: brew; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; background: var(--cream); color: var(--ink); border-radius: 18px; padding: 12px; box-shadow: var(--shadow); }
    .brew > * { flex-shrink: 0; }
    .brew { scroll-padding-bottom: 76px; } /* phần tử được cuộn tới không nằm dưới thanh hành động dính đáy */
    .brew-top { display: flex; flex-direction: column; gap: 10px; }
    .tbtn .sm { display: none; }
    #muteBtn { position: relative; z-index: 51; } /* nổi trên lớp phủ (.overlay z 50): tắt tiếng được cả lúc Chuẩn bị ca / Tạm dừng / Chốt ca, kể cả trên điện thoại không có phím M */
    #muteBtn[data-mode="sfx"]::after { content: "♪"; position: absolute; right: 3px; bottom: 1px; font-size: 12px; line-height: 1; opacity: .9; text-decoration: line-through; text-decoration-thickness: 2px; }
    .brew.closed .station, .brew.closed .steps { opacity: .55; }
    .ticket { position: relative; background: #fffaf0; border-radius: 12px; padding: 10px 12px 10px; box-shadow: 0 0 0 1.5px var(--cream3) inset; min-height: 70px; }
    .ticket::before { content: ""; position: absolute; top: -6px; left: 50%; width: 46px; height: 12px; margin-left: -23px; border-radius: 4px; background: var(--caramel); box-shadow: 0 2px 0 #5c3a26; }
    .ticket.empty { display: grid; place-items: center; }
    .ticket-empty { margin: 4px 0; color: var(--ink2); text-align: center; font-weight: 600; }
    .ticket-head { display: flex; align-items: center; gap: 10px; }
    .ticket-head > div { display: grid; line-height: 1.2; flex: 1; min-width: 0; }
    .t-name { font-size: 13px; color: var(--ink2); }
    .t-drink { font-size: 17px; font-weight: 800; }
    .t-price { font-weight: 800; color: var(--teal); font-size: 16px; }
    .t-items { list-style: none; margin: 8px 0 8px; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .t-items li { display: flex; align-items: center; gap: 4px; background: var(--cream2); border-radius: 10px; padding: 2px 8px 2px 3px; font-size: 13px; font-weight: 700; }
    .t-items li.ok { background: var(--teal-l); color: #1d4a44; }
    .t-items li.ok::after { content: "✓"; font-weight: 800; }
    .t-items li.bad { background: var(--red-l); color: #7a2a22; }
    .t-items li.bad::after { content: "≠"; font-weight: 800; }
    .pbar.wide { position: relative; transform: none; width: 100%; box-shadow: none; background: var(--cream3); }

    .station { position: relative; display: flex; align-items: flex-end; justify-content: center; gap: 0; border-radius: 14px; overflow: hidden;
      background: url(assets/shop-scene.webp) -250px -40px / 1280px 720px no-repeat; image-rendering: pixelated; }
    .station::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 70% at 55% 60%, rgba(255, 236, 200, .45), rgba(22, 32, 45, .38) 80%); }
    .station::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 34px; background: linear-gradient(#a3653d, #7d4a2c); box-shadow: 0 -3px 0 #c2814f inset, 0 -6px 0 rgba(0, 0, 0, .15); }
    .cupview { position: relative; z-index: 1; display: flex; align-items: flex-end; justify-content: center; width: 100%; padding: 4px 0 6px; }
    .bigcup { position: relative; flex: none; z-index: 2; }
    .cup-layers, .cup-fx { position: absolute; inset: 0; }
    .cup-layers .spr, .cup-fx .spr { left: 0; top: 0; }
    .cup-fx .steam { opacity: .55; }
    .cup-layers .in { animation: layerIn .35s .22s both ease-out; }
    .cup-layers .in-late { animation: layerIn .2s .42s both ease-out; }
    @keyframes layerIn { from { opacity: 0; } }
    .bar-upper { position: relative !important; flex: none; z-index: 1; margin-right: -26px; margin-bottom: 18px; }
    .cup-empty { position: absolute; z-index: 3; left: 50%; top: 14px; transform: translateX(-50%); background: rgba(255, 242, 220, .94); color: var(--ink); border-radius: 10px; padding: 4px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; }

    .kitchen { display: flex; align-items: center; gap: 8px; background: #fffaf0; border-radius: 12px; padding: 6px 8px; box-shadow: 0 0 0 1.5px var(--cream3) inset; }
    .k-info { flex: 1; display: grid; line-height: 1.2; min-width: 0; gap: 2px; }
    .k-info b { font-size: 13px; }
    .k-info small { font-size: 11px; color: var(--ink2); font-weight: 600; }
    .k-bars { display: grid; gap: 3px; }
    .pbar.cook i { background: var(--amber); transition: none; }
    .k-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .btn.hint { box-shadow: 0 0 0 3px var(--teal), 0 3px 0 var(--cream3); animation: hint 1.2s ease-in-out infinite; }
    .steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .steps li { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; gap: 0; font-size: 11px; font-weight: 700; color: var(--ink2); padding: 3px 4px; border-radius: 10px; background: var(--cream2); min-width: 50px; }
    .steps li.done { background: var(--teal-l); color: #1d4a44; }
    .steps li.now { background: var(--amber); color: #3b2209; box-shadow: 0 0 0 2px #c27c26 inset; }
    .opts-title { margin: 0; font-weight: 800; font-size: 15px; }
    .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
    .opt { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 92px; padding: 6px 6px 7px; border-radius: 14px; border: 0; cursor: pointer;
      background: #fffaf0; box-shadow: 0 0 0 1.5px var(--cream3) inset, 0 3px 0 var(--cream3); color: var(--ink); touch-action: manipulation; transition: translate .1s, box-shadow .1s; }
    .opt.lvl { min-height: 66px; }
    .opt .ico.ghost { opacity: .35; filter: grayscale(1); }
    @media (min-width: 761px) and (max-height: 820px) { .opt { min-height: 80px; } .ticket { padding: 8px 10px; } .t-items { margin: 6px 0; } }
    .opt:hover:not(:disabled) { box-shadow: 0 0 0 2px var(--teal2) inset, 0 3px 0 var(--cream3); }
    .opt-name { font-weight: 800; font-size: 14px; line-height: 1.15; text-align: center; }
    .opt small { font-size: 11px; color: var(--ink2); font-weight: 600; }
    .opt kbd { position: absolute; top: 4px; left: 6px; font: 700 10px "Be Vietnam Pro", system-ui; color: var(--ink2); opacity: .6; }
    .opt:disabled { cursor: not-allowed; opacity: .5; }
    .opt.out small { color: var(--red); font-weight: 800; }
    .opt.hint { box-shadow: 0 0 0 3px var(--teal) inset, 0 3px 0 var(--cream3); animation: hint 1.2s ease-in-out infinite; }
    .opt.hint::after { content: "Phiếu ghi"; position: absolute; top: -8px; right: 6px; background: var(--teal); color: #fff; font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 6px; }
    @keyframes hint { 50% { translate: 0 -2px; } }
    .acts { display: flex; gap: 8px; margin-top: auto; position: sticky; bottom: -12px; background: var(--cream); padding: 8px 0 0; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 8px 14px; border-radius: 13px; border: 0; cursor: pointer; font-weight: 800; font-size: 14px;
      background: var(--cream2); color: var(--ink); box-shadow: 0 3px 0 var(--cream3); touch-action: manipulation; }
    .btn:hover:not(:disabled) { background: #f3dcb6; }
    .btn:disabled { opacity: .45; cursor: default; }
