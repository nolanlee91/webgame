  <style>
    :root {
      --night: #1c1a3a; --night2: #2b2a5c; --cream: #fff2dc; --cream2: #f7e4c4; --cream3: #efd5aa; --ink: #3b2618; --ink2: #6b4a33;
      --brown: #7a4a30; --indigo: #2c3a78; --indigo2: #3e4e96; --ember: #c2361e; --ember-l: #f6d3cc; --amber: #e3a04a; --amber-l: #ffe3b0; --moss: #2f5a50; --moss-l: #d6ebe4;
      --shadow: 3px 4px 0 0 rgba(6, 5, 18, .55); --r: 14px;
      /* Khung pixel V5 (TLC1-04), cùng ngôn ngữ Nông Trại / _shared/px-confirm.js: viền 3 px = 4 box-shadow ⇒ góc khuyết bậc, bóng cứng lệch, không bo tròn */
      --line: #2a1a10; --px-drop: 3px 4px 0 0 rgba(6, 5, 18, .55);
      --px-bevel: inset 0 2px 0 rgba(255, 255, 255, .55), inset 0 -3px 0 rgba(122, 74, 48, .16);
      --m-raw: #D9887A; --m-half: #C26A4E; --m-done: #A4522A; --m-char: #4A2210; --m-burnt: #231410;
      --t1: #f2c94c; --t2: #3fb8a8; --t3: #e0559a; --t4: #a99be0; --t5: #ee8a3c;
      --colW: 342px; --gbH: 112px; --hudH: 48px;
    }
    @media (min-width: 1700px) and (min-height: 960px) { :root { --colW: 400px; --gbH: 140px; } }
    * { box-sizing: border-box; }
    /* --b = màu viền, tính tại từng phần tử ⇒ trạng thái (.on / .hint) chỉ cần đổi --b */
    * { --px-border: 0 -3px 0 0 var(--b, var(--line)), 0 3px 0 0 var(--b, var(--line)), -3px 0 0 0 var(--b, var(--line)), 3px 0 0 0 var(--b, var(--line));
      --px-border2: 0 -2px 0 0 var(--b, var(--line)), 0 2px 0 0 var(--b, var(--line)), -2px 0 0 0 var(--b, var(--line)), 2px 0 0 0 var(--b, var(--line)); }
    /* khung do JS chèn (ui/drama.js, ui/progress-ui.js) cũng vuông góc — ghi đè ở đây để khỏi đổi tag các module đó */
    .dportrait, .dportrait .pname, .drama-talk .say, .drama-sheet .fxchip, .a-drag, .a-drag .zone, .a-drag .pin, .a-drag .pin.has-spr small, .a-tag, .a-missions, .a-ghiso { border-radius: 0 !important; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; }
    body { background: radial-gradient(120% 80% at 50% 0%, #2b2a5c 0%, var(--night) 60%) var(--night); color: var(--cream); font: 500 14px/1.4 "Be Vietnam Pro", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent; min-height: 100svh; overflow: hidden; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

    /* ---------- HUD ---------- */
    .top { height: var(--hudH); display: flex; align-items: center; gap: 10px; padding: 0 10px; background: #0f0e22; box-shadow: inset 0 -3px 0 #000, inset 0 2px 0 rgba(255, 255, 255, .08); }
    .top a.back { color: var(--cream3); text-decoration: none; font-weight: 700; font-size: 13px; padding: 0 4px; white-space: nowrap; min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
    .top h1 { margin: 0; font-size: 16px; font-weight: 800; white-space: nowrap; }
    .top .shop { color: var(--amber-l); font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
    .chips { display: flex; gap: 6px; align-items: center; min-width: 0; overflow: hidden; }
    .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--cream); color: var(--ink); padding: 2px 8px; font-size: 13px; font-weight: 700; white-space: nowrap; --b: #07061a; box-shadow: inset 0 -2px 0 var(--cream3), var(--px-border2); }
    .chip b { font-weight: 800; font-variant-numeric: tabular-nums; }
    .chip small { font-size: 11px; color: var(--ink2); }
    .chip.warn { background: var(--ember-l); }
    .tools { margin-left: auto; display: flex; gap: 6px; }
    .tbtn { min-height: 44px; min-width: 44px; padding: 4px 10px; border: 0; background: #2b2a52; --b: #07061a; cursor: pointer; font-weight: 700; font-size: 12px; white-space: nowrap;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, .12), inset 0 -2px 0 rgba(0, 0, 0, .35), var(--px-border2), 2px 2px 0 0 #07061a; }
    #muteBtn .snd-ico { display: none; } /* D9: ≤ 360 px chỉ hiện biểu tượng (game.js syncMute), rộng hơn thì hiện chữ */
    @media (max-width: 360px) { #muteBtn { display: inline-grid; place-items: center; padding-inline: 4px; } #muteBtn .snd-ico { display: block; } #muteBtn .snd-l { display: none; } }
    #muteBtn { position: relative; z-index: 51; } /* nổi trên lớp phủ (.overlay z 50): tắt tiếng được cả lúc Chuẩn bị ca / Tạm dừng / Chốt ca, kể cả trên điện thoại không có phím M */
    .tbtn:hover { background: rgba(255, 242, 220, .16); }
    .tbtn:disabled { opacity: .45; cursor: default; }

    /* ---------- bố cục desktop: Cảnh + Thanh Bếp | Cột Dĩa ---------- */
    .app { display: grid; grid-template-columns: var(--worldW) var(--colW); justify-content: center; height: calc(100svh - var(--hudH)); opacity: 0; transition: opacity .3s;
      --worldW: min(calc(100vw - var(--colW)), calc((100svh - var(--hudH) - var(--gbH)) * 16 / 9)); }
    .app.ready { opacity: 1; }
    .left { display: flex; flex-direction: column; min-width: 0; }
    .world { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #241a14; }
    .scene { position: absolute; inset: 0; overflow: hidden; }
    .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; image-rendering: pixelated; }
    .stage .layer { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; image-rendering: pixelated; pointer-events: none; user-select: none; }
    .spr { position: absolute; background-repeat: no-repeat; image-rendering: pixelated; pointer-events: none; }
    .stage.smooth, .stage.smooth .layer, .stage.smooth .spr { image-rendering: auto; }
    .counter-layer { position: absolute; inset: 0; z-index: 300; pointer-events: none; }
    .back-layer { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
    .floor-layer { position: absolute; inset: 0; z-index: 400; pointer-events: none; }
    .floor-layer > .spr { z-index: 1000; }
    .spr.flip { transform: scaleX(-1); }
    .spr.owner { z-index: 100; }
    .spr.cust.sel { filter: drop-shadow(0 0 2px #fff6d6) drop-shadow(0 0 6px rgba(255, 220, 140, .95)); }
    .fx { position: absolute; inset: 0; pointer-events: none; z-index: 5000; }
    /* V: thời tiết (weather-fx ×2 phủ cảnh) + vật dụng quán */
    .weather { position: absolute; inset: 0; pointer-events: none; z-index: 4000; }
    .weather.weather-back { z-index: 5; }
    .weather .spr { left: 0; top: 0; }
    .wx-dark { position: absolute; inset: 0; background: rgba(8, 8, 30, .55); }
    .wx-flash { position: absolute; inset: 0; background: rgba(236, 242, 255, .32); }
    /* V: bếp lớn HD (grill-hd + grill-items-hd + owner-actions-hd) */
    .bigrill { position: absolute; left: 8px; bottom: 8px; z-index: 9; background: linear-gradient(#2b2238, #1d1726); padding: 6px 8px 8px; --b: var(--cream3); box-shadow: var(--px-border2), 3px 4px 0 0 rgba(0, 0, 0, .5); color: var(--cream); }
    .bigrill[hidden] { display: none; }
    .bg-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 12.5px; }
    .bg-head .bg-info { flex: 1; opacity: .85; font-weight: 600; }
    .bg-close { min-height: 44px; min-width: 44px; border: 0; padding: 2px 10px; background: var(--cream); color: var(--ink); font-weight: 800; cursor: pointer; }
    .bg-stage { position: relative; overflow: hidden; background: radial-gradient(120% 90% at 50% 100%, #6a3a22 0%, #3a2430 55%, #241a2c 100%); }
    .bg-stage .spr { image-rendering: pixelated; }
    .bg-slot { position: absolute; border: 0; background: transparent; cursor: pointer; padding: 0; display: flex; align-items: flex-end; justify-content: center; touch-action: manipulation; }
    .bg-slot span { background: rgba(255, 250, 240, .94); color: var(--ink); padding: 0 5px; font-size: 11px; font-weight: 800; line-height: 1.5; margin-bottom: -2px; }
    .bg-slot span:empty { display: none; }
    .bg-slot.ready { box-shadow: inset 0 0 0 3px #ffd36a; }
    .bg-slot.danger { box-shadow: inset 0 0 0 3px #ff5a3c; }
    .bg-slot.locked { cursor: default; opacity: .8; }
    .scene-ui { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
    .tbtn-scene { position: absolute; pointer-events: auto; background: transparent; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
    .tbtn-scene:hover, .tbtn-scene:focus-visible { box-shadow: inset 0 0 0 2px rgba(255, 242, 220, .55); }
    .tbtn-scene.hot { box-shadow: inset 0 0 0 2px rgba(255, 217, 138, .75); }
    .tbtn-scene.hint { box-shadow: inset 0 0 0 3px var(--amber), 0 0 0 2px rgba(255, 210, 120, .6); animation: pulse 1.1s ease-in-out infinite; }
    .tbadge { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); background: rgba(255, 250, 240, .97); color: var(--ink); padding: 1px 8px; font-size: 11px; font-weight: 800; white-space: nowrap; box-shadow: 0 0 0 2px var(--ink); }
    .tbtn-scene.hot .tbadge { background: #fff4c8; }
    .tbtn-scene[data-job="bill"] .tbadge { background: #d9f2df; }
    .tbtn-scene[data-job="clean"] .tbadge { background: var(--ember-l); }
    .tring { position: absolute; right: 4px; bottom: 4px; width: 16px; height: 16px; background: conic-gradient(#7fc08d calc(var(--p, 1) * 1turn), rgba(20, 20, 40, .35) 0); box-shadow: 0 0 0 2px var(--cream); }
    .tring.mid { background: conic-gradient(var(--amber) calc(var(--p, 1) * 1turn), rgba(20, 20, 40, .35) 0); } .tring.low { background: conic-gradient(#e0604f calc(var(--p, 1) * 1turn), rgba(20, 20, 40, .35) 0); }
    .gbtn { position: absolute; pointer-events: auto; background: rgba(22, 22, 45, .88); color: var(--cream); border: 0; cursor: pointer; padding: 0 6px 4px; touch-action: manipulation; font-size: 12px; font-weight: 800; overflow: hidden; box-shadow: 0 0 0 2px rgba(255, 242, 220, .6); }
    .gbtn .pfill { position: absolute; left: 0; bottom: 0; height: 5px; background: #7fc08d; } .gbtn.mid .pfill { background: var(--amber); } .gbtn.low .pfill { background: #e0604f; }
    .gbtn b { position: relative; }
    .gbtn.sel { box-shadow: inset 0 0 0 3px #9ff0dc; } .gbtn.hint { box-shadow: inset 0 0 0 3px var(--amber); animation: pulse 1.1s ease-in-out infinite; }
    .gtag { position: absolute; transform: translate(-50%, -100%); background: rgba(22, 22, 45, .85); color: var(--cream); padding: 1px 7px 3px; font-size: 11px; font-weight: 800; white-space: nowrap; overflow: hidden; }
    .gtag .pfill { position: absolute; left: 0; bottom: 0; height: 3px; background: #7fc08d; } .gtag.mid .pfill { background: var(--amber); } .gtag.low .pfill { background: #e0604f; } .gtag.sel { background: var(--moss); }
    .gtag b { position: relative; }
    /* bong bóng: nền đục, viền mực 2 px, không mờ dần */
    .bubble { position: absolute; max-width: 220px; width: max-content; background: #fffaf0; color: var(--ink); padding: 6px 10px; font-size: 12.5px; font-weight: 700; line-height: 1.35; --b: var(--ink); box-shadow: var(--px-border2), 3px 4px 0 0 rgba(0, 0, 0, .45); z-index: 3; opacity: 1; }
    .bubble::after { content: ""; position: absolute; left: var(--tail, 50%); bottom: -9px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: var(--ink); }
    .bubble[data-side="right"]::after { left: -9px; top: 12px; bottom: auto; margin: 0; border: 7px solid transparent; border-left: 0; border-right-color: var(--ink); }
    .bubble[data-side="left"]::after { left: auto; right: -9px; top: 12px; bottom: auto; margin: 0; border: 7px solid transparent; border-right: 0; border-left-color: var(--ink); }
    .bubble.pop { animation: bubblePop .2s ease-out; }
    @keyframes bubblePop { from { translate: 0 6px; scale: .94; } }
    @keyframes pulse { 50% { transform: scale(1.03); } }
    .banner { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: rgba(22, 22, 45, .92); color: var(--cream); padding: 6px 14px; font-weight: 800; z-index: 12; max-width: 90%; text-align: center; pointer-events: none; }
    /* dải gợi ý + thông báo nằm ĐẦU khung cảnh (vùng trời / mặt tiền, không có bàn, không có nút): đáy cảnh là hàng bàn trước + chỗ shipper */
    .hintbar { position: absolute; left: 8px; right: 8px; top: 8px; z-index: 12; background: rgba(47, 90, 80, .96); color: #fff; padding: 7px 12px; font-weight: 700; font-size: 13.5px; pointer-events: none; }
    .away { position: absolute; inset: 0; z-index: 11; display: grid; place-items: center; background: rgba(10, 10, 30, .4); color: var(--cream); font-weight: 800; font-size: 17px; text-align: center; padding: 20px; pointer-events: none; }
    /* thông báo: trong khung cảnh, không bao giờ đè nút (bàn, khách chờ, Thanh Bếp, Cột Dĩa) */
    .toasts { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 13; pointer-events: none; }
    .hintbar:not([hidden]) ~ .toasts { top: 50px; }
    /* D11 TLC2-12: bảng phủ mở thì không vẽ thông báo đè thanh đầu (game.js xếp hàng, đóng bảng mới hiện lần lượt).
       Câu quan trọng (sắp hết cơm / dĩa / than) và trả lời thao tác trong bảng: một dòng trong chân bảng dính đáy (ngay trên nút chính), không có thì dưới tiêu đề */
    .footer > .sheet-note { flex: 1 1 100%; margin: 0 0 2px; }
    .sheet-note { margin: 2px 0 8px; padding: 6px 12px; font-weight: 800; font-size: 13.5px; background: #fffaf0; color: var(--ink);
      --b: var(--ink); box-shadow: var(--px-border2), 3px 4px 0 0 rgba(0, 0, 0, .25); }
    .sheet-note.good { background: #e3f4e6; } .sheet-note.warn { background: #ffe7dc; }
    .toast { background: rgba(255, 250, 240, .98); color: var(--ink); padding: 6px 12px; font-weight: 700; font-size: 13px; --b: var(--ink); box-shadow: var(--px-border2), 3px 4px 0 0 rgba(0, 0, 0, .45); max-width: 100%; animation: pop .2s steps(3); }
    .toast.good { background: #e3f4e6; } .toast.warn { background: #ffe7dc; } .toast.phase { background: #2b2a5c; color: var(--cream); --b: var(--cream3); }
    .toast.has-act { display: flex; align-items: center; gap: 10px; padding-right: 5px; }
    .toast-act { pointer-events: auto; flex: none; min-height: 44px; min-width: 44px; padding: 3px 14px; border: 0; cursor: pointer; font: inherit; font-weight: 800; font-size: 13px; background: var(--indigo2); color: #fff; --b: #141a3c; box-shadow: var(--px-border2), 2px 3px 0 0 #141a3c; touch-action: manipulation; }
    .toast-act:active { transform: translate(2px, 2px); box-shadow: var(--px-border2); }
    @keyframes pop { from { opacity: 0; translate: 0 6px; } }

    /* ---------- Thanh Bếp ---------- */
    .grillbar { height: var(--gbH); display: flex; align-items: stretch; gap: 8px; padding: 8px 10px; background: linear-gradient(#2a2238, #1f1a2c); border-top: 2px solid #3a3050; }
    .gchips { display: flex; gap: 6px; align-items: stretch; }
    .zone { display: flex; flex-direction: column; gap: 2px; }
    .zone > small { font-size: 10px; font-weight: 800; letter-spacing: .04em; text-align: center; color: var(--cream3); }
    .zone .row { display: flex; gap: 4px; }
    .gchip { position: relative; width: 76px; height: 76px; border: 0; padding: 0; cursor: pointer; background: #3a3040; box-shadow: inset 0 0 0 2px #4a4060; display: grid; place-items: center; touch-action: manipulation; }
    .gchip.hot { background: #4a2a24; } .gchip.mid { background: #3e2c2a; } .gchip.warm { background: #2e2c3a; }
    .gchip .ring { position: absolute; inset: 4px; background: conic-gradient(var(--c1, #555) 0 .5turn, var(--c2, #555) 0 1turn); opacity: .95; }
    .gchip .ring::after { content: ""; position: absolute; inset: 7px; background: #2a2230; }
    .gchip .ico { position: relative; z-index: 1; }
    .gchip .lbl { position: absolute; left: 0; right: 0; bottom: 2px; font-size: 10px; font-weight: 800; color: var(--cream); text-align: center; z-index: 2; text-shadow: 0 1px 0 #000; }
    .gchip.ready { box-shadow: inset 0 0 0 3px #7fd08d, 0 0 0 2px rgba(127, 208, 141, .5); }
    .gchip.danger { box-shadow: inset 0 0 0 3px #ff6a4a; animation: shake .25s linear infinite; }
    .gchip.burnt { box-shadow: inset 0 0 0 3px #888; }
    .gchip.hint { box-shadow: inset 0 0 0 3px var(--amber), 0 0 0 2px rgba(255, 210, 120, .7); }
    .gchip.locked { opacity: .55; }
    @keyframes shake { 25% { translate: -1px 0; } 75% { translate: 1px 0; } }
    .gctl { display: flex; flex-wrap: wrap; gap: 6px; align-content: center; flex: 1; min-width: 0; }
    .gbtn2 { min-height: 44px; min-width: 64px; border: 0; padding: 4px 10px; cursor: pointer; background: var(--cream); color: var(--ink); font-weight: 800; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; --b: var(--line); box-shadow: var(--px-bevel), var(--px-border2), 2px 3px 0 0 rgba(0, 0, 0, .45); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    .gbtn2:disabled { opacity: .5; cursor: default; }
    .gbtn2.on { background: #ffd9a0; --b: var(--ember); box-shadow: var(--px-bevel), var(--px-border2), inset 0 0 0 2px var(--ember); }
    .gbtn2.warn { background: var(--ember-l); } .gbtn2.out { background: var(--ember); color: #fff; --b: #5a1a10; } /* TLC22-04: bếp tắt */ .gbtn2.hint { --b: #c27c26; box-shadow: var(--px-bevel), var(--px-border2), inset 0 0 0 2px var(--amber), 2px 3px 0 0 rgba(0, 0, 0, .45); }
    .meter { width: 56px; height: 10px; background: rgba(0, 0, 0, .25); overflow: hidden; display: inline-block; vertical-align: middle; }
    .meter i { display: block; height: 100%; background: var(--c, #f2622a); }
    .gbtn2 small { font-size: 11px; font-weight: 700; color: var(--ink2); }

<body>
  <header class="top" id="hud">
    <a class="back" href="/" aria-label="Về trang chủ Lụm Kèo">←<span> Lụm Kèo</span></a>
    <h1>Quán Cơm Tấm</h1>
    <span class="shop" id="shopLabel"></span>
    <div class="chips" id="chips"></div>
    <div class="tools">

    <button type="button" data-dock="kitchen">Bếp</button>
