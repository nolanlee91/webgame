  <style>
    :root {
      --night: #18222f; --night2: #22344a; --cream: #fff2dc; --cream2: #f7e4c4; --cream3: #efd5aa; --ink: #3b2618; --ink2: #6b4a33;
      --caramel: #80543a; --moss: #2f5a50; --moss2: #3e7364; --moss-l: #d6ebe4; --amber: #e3a04a; --amber-l: #ffe3b0; --red: #b8433a; --red-l: #f6d3cc;
      --shadow: 0 6px 18px rgba(10, 14, 22, .28), 0 1px 0 rgba(255, 255, 255, .5) inset; --r: 14px;
      --c-raw: #e9c48a; --c-gold: #e3a04a; --c-dark: #8e4f22; --c-burnt: #3b2418;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; }
    body { background: radial-gradient(120% 80% at 50% 0%, #243447 0%, var(--night) 60%) var(--night); color: var(--cream); font: 500 15px/1.45 "Be Vietnam Pro", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent; min-height: 100svh; display: flex; flex-direction: column; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
    .top { flex: none; display: flex; align-items: center; gap: 12px; padding: 6px 14px; min-height: 52px; background: rgba(15, 22, 31, .88); border-bottom: 1px solid rgba(255, 255, 255, .06); }
    .top a { color: var(--cream3); text-decoration: none; font-weight: 700; padding: 10px 4px; }
    .top h1 { margin: 0; font-size: 18px; font-weight: 800; }
    .top .shop { color: var(--amber-l); font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .top .tools { margin-left: auto; display: flex; gap: 8px; }
    .tbtn { min-height: 40px; min-width: 44px; padding: 6px 12px; border-radius: 12px; border: 1px solid rgba(255, 242, 220, .18); background: rgba(255, 242, 220, .08); cursor: pointer; font-weight: 700; font-size: 13px; }
    #muteBtn { position: relative; z-index: 51; } /* nổi trên lớp phủ (.overlay z 50): tắt tiếng được cả lúc Chuẩn bị ca / Tạm dừng / Chốt ca, kể cả trên điện thoại không có phím M */
    .tbtn:hover { background: rgba(255, 242, 220, .16); }
    /* số review chưa trả lời trên nút Sổ (thanh trên + dock) */
    #bookBtn[data-count], #dock button[data-dock=book][data-count] { position: relative; }
    #bookBtn[data-count]::after, #dock button[data-dock=book][data-count]::after { content: attr(data-count); position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #d2453b; color: #fff; font-size: 11px; font-weight: 800; line-height: 18px; text-align: center; box-shadow: 0 0 0 2px #1b1f2a; }
    .rev-cta { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 8px; background: #2e6b5c; color: #fff; font-size: 11px; font-weight: 800; vertical-align: middle; }
    .btn.accent { background: #d98a2b; color: #fff; }
    .tbtn:disabled { opacity: .45; cursor: default; }

    .app { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 420px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "world bench" "rail bench";
      gap: 12px; padding: 12px; min-height: 0; height: calc(100svh - 52px); opacity: 0; transition: opacity .3s; }
    .app.ready { opacity: 1; }
    .world { grid-area: world; position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: calc(100svh - 52px - 24px - 120px - 12px); border-radius: 18px; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35), 0 0 0 1px rgba(255, 255, 255, .06); background: #2b1d14; }
    .scene { position: absolute; inset: 0; overflow: hidden; }
    .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; image-rendering: pixelated; }
    .stage .layer { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; image-rendering: pixelated; pointer-events: none; user-select: none; }
    .spr { position: absolute; background-repeat: no-repeat; image-rendering: pixelated; }
    .stage.smooth, .stage.smooth .layer, .stage.smooth .spr { image-rendering: auto; }
    .stage > .spr, .display, .display .spr { pointer-events: none; }
    .display { position: absolute; inset: 0; }
    .oven.ready { filter: drop-shadow(0 0 6px rgba(255, 210, 122, .95)); }
    .crowd { position: absolute; inset: 0; }
    .cust { border: 0; padding: 0; margin: 0; background-color: transparent; cursor: default; touch-action: manipulation; }
    .cust.can-pin { cursor: pointer; }
    .cust.can-pin:hover, .cust.can-pin:focus-visible { filter: drop-shadow(0 0 2px #fff6d6) drop-shadow(0 0 6px rgba(255, 220, 140, .9)); outline: none; }
    .cust.hint { filter: drop-shadow(0 0 2px #fff6d6) drop-shadow(0 0 10px rgba(255, 220, 140, 1)); }
    .cust.active { filter: drop-shadow(0 0 2px #9ff0dc) drop-shadow(0 0 8px rgba(80, 200, 170, .9)); }
    .cust.flip { transform: scaleX(-1); }
    .fx { position: absolute; inset: 0; pointer-events: none; z-index: 900; }
    .scene-ui { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
    /* bong bóng đặt bằng toạ độ góc trái trên (render/scene.js placeBubble): trên đầu / bên phải / bên trái khách, không che mặt chủ tiệm */
    /* bong bóng luôn đục (không bao giờ mờ dần), viền đậm để đọc được trên mọi nền cảnh */
    .bubble { position: absolute; max-width: 230px; width: max-content; background: #fffaf0; color: var(--ink); border-radius: 14px; padding: 7px 11px; font-size: 13px; font-weight: 700; line-height: 1.35; box-shadow: 0 0 0 2px var(--ink), 0 4px 12px rgba(0, 0, 0, .35); z-index: 3; opacity: 1; }
    .bubble::after { content: ""; position: absolute; left: var(--tail, 50%); bottom: -9px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: var(--ink); }
    .bubble[data-side="right"]::after { left: -9px; top: 14px; bottom: auto; margin: 0; border: 7px solid transparent; border-left: 0; border-right-color: var(--ink); }
    .bubble[data-side="left"]::after { left: auto; right: -9px; top: 14px; bottom: auto; margin: 0; border: 7px solid transparent; border-right: 0; border-left-color: var(--ink); }
    .bubble.pop { animation: bubblePop .22s ease-out; }
    @keyframes bubblePop { from { translate: 0 6px; scale: .94; } }
    @keyframes pop { from { opacity: 0; translate: 0 6px; scale: .92; } }
    .pbar { position: absolute; width: 58px; height: 8px; transform: translateX(-50%); background: rgba(22, 32, 45, .6); border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1.5px rgba(255, 242, 220, .7); }
    .pbar i { display: block; height: 100%; width: 100%; background: #7fc08d; border-radius: 6px; transition: width .2s linear; }
    .pbar.mid i { background: var(--amber); } .pbar.low i { background: #e0604f; }
    .ctag { position: absolute; transform: translate(-50%, -100%); font-size: 11px; font-weight: 700; color: var(--cream); background: rgba(22, 32, 45, .75); padding: 1px 7px; border-radius: 8px; white-space: nowrap; }
    .ctag.on { background: var(--moss); }
    .case-tag { background: rgba(128, 84, 58, .88); } .case-tag.low { background: rgba(160, 60, 50, .92); }
    .stage .loafmini { image-rendering: auto; }
    .stage .weather { pointer-events: none; opacity: .75; z-index: 800; }

    .hud { position: absolute; top: 8px; left: 8px; right: 140px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 10; pointer-events: none; }
    .chip { display: flex; align-items: center; gap: 6px; background: rgba(255, 242, 220, .95); color: var(--ink); border-radius: 12px; padding: 3px 10px; box-shadow: 0 3px 10px rgba(0, 0, 0, .25); }
    .chip b { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .chip small { font-size: 11px; color: var(--ink2); font-weight: 600; }
    .chip.low { background: var(--red-l); box-shadow: 0 0 0 2px #c0392b, 0 3px 10px rgba(0, 0, 0, .25); }
    .ico { display: inline-block; flex: none; background-repeat: no-repeat; image-rendering: pixelated; vertical-align: middle; }
    .pills { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; z-index: 11; }
    .pill { display: flex; align-items: center; gap: 8px; min-height: 44px; min-width: 120px; padding: 4px 10px 4px 6px; border-radius: 22px; border: 0; cursor: pointer; background: rgba(255, 242, 220, .96); color: var(--ink); font-weight: 800; font-size: 13px; box-shadow: 0 3px 10px rgba(0, 0, 0, .3); }
    .pill .ring { width: 34px; height: 34px; border-radius: 50%; background: conic-gradient(var(--crust, var(--c-raw)) calc(var(--p, 0) * 1turn), rgba(59, 38, 24, .15) 0); display: grid; place-items: center; }
    .pill .ring::after { content: ""; width: 20px; height: 20px; border-radius: 50%; background: var(--crust, var(--c-raw)); box-shadow: 0 0 0 2px #fff8 inset; }
    .pill.ready { background: #fff4c8; box-shadow: 0 0 0 3px #3e9a5a, 0 3px 10px rgba(0, 0, 0, .3); animation: pulse 0.8s ease-in-out infinite; }
    .pill.danger { background: var(--red-l); box-shadow: 0 0 0 3px var(--red), 0 3px 10px rgba(0, 0, 0, .3); }
    .pill.gas { cursor: default; min-height: 30px; font-size: 12px; }
    .pill.gas.low { background: var(--amber-l); } .pill.gas.out { background: var(--red-l); }
    @keyframes pulse { 50% { transform: scale(1.04); } }
    .banner { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); background: rgba(22, 32, 45, .9); color: var(--cream); padding: 8px 16px; border-radius: 14px; font-weight: 800; z-index: 12; box-shadow: 0 4px 14px rgba(0, 0, 0, .4); max-width: 90%; text-align: center; }
    .hintbar { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 12; background: rgba(47, 90, 80, .95); color: #fff; border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 14px; box-shadow: 0 4px 14px rgba(0, 0, 0, .35); pointer-events: none; }
    .away { position: absolute; inset: 0; z-index: 13; display: grid; place-items: center; background: rgba(10, 14, 22, .45); color: var(--cream); font-weight: 800; font-size: 18px; text-align: center; padding: 20px; pointer-events: none; }

    .rail { grid-area: rail; display: flex; gap: 10px; overflow-x: auto; align-items: stretch; padding: 2px 2px 6px; min-height: 0; scrollbar-width: thin; }
    .rail-empty { margin: auto 0; color: var(--cream3); opacity: .85; padding: 0 6px; }
    .slip { flex: none; width: 190px; min-height: 100px; text-align: left; border: 0; border-radius: var(--r); background: var(--cream); color: var(--ink); padding: 8px 10px; cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 3px; position: relative; }
    .slip:disabled { opacity: .75; cursor: default; }
    .slip.on { box-shadow: 0 0 0 3px var(--moss), var(--shadow); }
    .slip.hint { box-shadow: 0 0 0 3px var(--amber), var(--shadow); animation: hint 1.2s ease-in-out infinite; }
    .slip b { font-size: 14px; } .slip .what { font-size: 13px; font-weight: 700; color: var(--caramel); }
    .slip .q { display: flex; flex-wrap: wrap; gap: 3px; }
    .qchip { font-size: 11px; font-weight: 800; border-radius: 7px; padding: 0 6px; background: var(--red-l); color: #7a2a22; }
    .qchip.crisp { background: var(--amber-l); color: #6a4410; } .qchip.cut { background: var(--moss-l); color: #1d4a44; } .qchip.up { background: #ffe1c8; color: #7a3a10; }
    .slip .pbar { position: static; transform: none; width: 100%; box-shadow: none; background: var(--cream3); margin-top: auto; }
    .slip .state { font-size: 12px; font-weight: 800; color: var(--moss); }
    .slip.pre, .ticket.pre { box-shadow: 0 0 0 3px #d9a520, var(--shadow); } .slip .state.due { color: #8a5a10; }
    .t-items.boards .t-item { min-height: 36px; }
    .opt.batch { background: var(--amber-l); } .opt.auto { background: var(--moss-l); }
    .billbtn.sug { box-shadow: 0 0 0 3px #d9a520 inset, 0 3px 0 var(--cream3); }
    .card-note { background: #fffaf0; border-radius: 12px; padding: 8px 12px; margin: 6px 0; box-shadow: 0 0 0 1.5px var(--cream3) inset; }
    .card-note.gold { box-shadow: 0 0 0 2px #d9a520 inset; background: #fff4d6; } .card-note .row { margin-top: 6px; }
    .stockitem.owned { opacity: .75; }
    .say.headline { font-size: 17px; font-weight: 800; }
    /* hội thoại drama: chân dung trái (người nói) + phải (chủ tiệm) */
    .sheet.drama { width: min(760px, 100%); }
    .drama-stage { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: end; }
    .portrait { display: grid; justify-items: center; gap: 2px; min-width: 120px; }
    .portrait .pic { border-radius: 12px; background: radial-gradient(70% 70% at 50% 60%, #ffe8c0, #e8c89a); }
    .portrait.me .pic { opacity: .95; }
    .portrait .ini { width: 110px; height: 110px; border-radius: 50%; display: grid; place-items: center; font-size: 46px; font-weight: 800; background: var(--amber-l); color: var(--caramel); }
    .portrait .pname { font-size: 13px; }
    .drama-talk { display: grid; gap: 8px; align-self: center; }
    .say.me { background: var(--moss-l); }
    .fxrow { gap: 6px; }
    /* Sổ */
    .sheet.book { width: min(1000px, 100%); }
    .nb-head { justify-content: space-between; }
    .nb-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    .nb-list { display: grid; gap: 4px; max-height: 60vh; overflow-y: auto; align-content: start; }
    .revbtn { text-align: left; border: 0; cursor: pointer; font: inherit; color: var(--ink); }
    .revbtn.on { box-shadow: 0 0 0 2px var(--moss); } .rev.done { opacity: .85; } .rev.cart { background: #fff4d6; }
    .rev.big { font-size: 15px; font-weight: 700; }
    .persona-switch { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
    .persona-switch .ps.on { background: var(--moss); color: #fff; }
    .persona-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin: 6px 0; }
    .pcard { text-align: left; border: 0; border-radius: 12px; padding: 8px 10px; background: #fffaf0; box-shadow: 0 0 0 1.5px var(--cream3) inset; cursor: pointer; display: grid; gap: 2px; }
    .pcard.on { box-shadow: 0 0 0 3px var(--moss) inset; background: var(--moss-l); } .pcard small { color: var(--ink2); }
    .comeback { color: var(--ink2); }
    .bw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
    .bw-item { background: #fffaf0; border-radius: 10px; padding: 6px 8px; box-shadow: 0 0 0 1.5px var(--cream3) inset; opacity: .6; display: grid; gap: 1px; }
    .bw-item.on { opacity: 1; background: #fff4d6; box-shadow: 0 0 0 2px #d9a520 inset; } .bw-item small { color: var(--ink2); font-weight: 600; }
    .week { display: flex; gap: 4px; flex-wrap: wrap; } .week span { font-size: 11px; font-weight: 800; background: var(--cream2); border-radius: 7px; padding: 1px 6px; } .week span.on { background: var(--moss); color: #fff; }
    .journal-canvas { width: min(540px, 100%, calc((100svh - 190px) * 0.8)); height: auto; aspect-ratio: 1080 / 1350; display: block; margin: 8px auto; border-radius: 12px; box-shadow: var(--shadow); }
    /* dock mobile + lên tiệm + trang trí */
    .dock { display: none; }
    .move { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: #18222f; color: var(--cream); font-size: 22px; font-weight: 800; text-align: center; padding: 20px; }
    .move.go { animation: move 4s ease-in-out both; }
    .move .shutter { position: absolute; left: 0; right: 0; top: 0; height: 100%; background: repeating-linear-gradient(#5e6670 0 6px, #4a525c 6px 10px); animation: shutter 4s ease-in-out both; }
    .move span { position: relative; }
    @keyframes move { 0% { opacity: 0; } 10%, 85% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes shutter { 0%, 25% { transform: translateY(0); } 75%, 100% { transform: translateY(-100%); } }
    .decor-bar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 40; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--cream); color: var(--ink); border-radius: 14px; padding: 8px 10px; box-shadow: var(--shadow); width: min(760px, calc(100% - 24px)); }
    .decor-on .scene { cursor: crosshair; } .decor-on .decor { outline: 2px dashed rgba(255, 220, 140, .9); }
    @media (prefers-reduced-motion: reduce) {
      .move.go, .move .shutter { animation: none; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }

    .bench { grid-area: bench; display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; background: var(--cream); color: var(--ink); border-radius: 18px; padding: 10px 12px 12px; box-shadow: var(--shadow); scroll-padding-bottom: 76px; }
    .bench > * { flex-shrink: 0; }
    .box { background: #fffaf0; border-radius: 12px; padding: 6px 8px; box-shadow: 0 0 0 1.5px var(--cream3) inset; }
    .oven-row { display: flex; align-items: center; gap: 8px; }
    .crust { position: relative; flex: 1; height: 18px; border-radius: 9px; overflow: hidden; background: linear-gradient(90deg, var(--c-raw) 0 22%, #efd29a 22% 72%, var(--c-gold) 72% 89%, var(--c-dark) 89% 100%); box-shadow: 0 0 0 1.5px var(--cream3) inset; }
    .crust .zone { position: absolute; top: 0; bottom: 0; border: 2px solid #3e9a5a; border-radius: 6px; }
    .crust .zone::after { content: "Rút!"; position: absolute; top: -1px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 800; color: #1d4a2a; }
    .crust .mark { position: absolute; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; background: #222; border-radius: 2px; box-shadow: 0 0 0 1.5px #fff; }
    .oven-lbl { min-width: 86px; font-size: 12px; font-weight: 800; }
    .cook-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
    .cook-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: var(--cream2); border-radius: 10px; padding: 3px 4px 3px 8px; min-width: 0; }
