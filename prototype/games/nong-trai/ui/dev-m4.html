<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:," />
  <title>DEV M4 · Chăn nuôi + Làng (chỉ để thử)</title>
  <link rel="stylesheet" href="../../../assets/fonts/fonts.css?v=f1" />
  <style>
    /* Trang thử nội bộ cho Milestone 4 — KHÔNG liên kết từ đâu, không phải trang chơi thật. */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background: #17110c; }
    body { margin: 0; min-height: 100svh; background: radial-gradient(120% 90% at 50% 35%, #2c3a1a 0%, #1c2412 55%, #0f130a 100%) #17110c; color: #f4ead2;
      font: 500 15px/1.5 "Be Vietnam Pro", system-ui, sans-serif; }
    .dev-bar { position: relative; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 8px 12px;
      background: #3a0d0d; box-shadow: inset 0 -3px 0 #000; font-size: 13px; }
    .dev-bar strong { color: #ffb08a; letter-spacing: .06em; }
    .dev-bar button, .dev-bar select { min-height: 36px; padding: 4px 9px; font: 700 13px "Be Vietnam Pro", system-ui; color: #f4ead2; background: #262019; border: 0;
      box-shadow: 0 0 0 2px #0a0807; cursor: pointer; }
    .dev-bar button[aria-pressed="true"] { background: #7a4d12; color: #ffc94a; }
    .dev-bar .stat { font-variant-numeric: tabular-nums; color: #ffe9a8; }
    .dev-more { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
    .dev-more[hidden] { display: none; }
    .nav { display: flex; gap: 8px; padding: 10px 16px 0; max-width: 1180px; margin: 0 auto; }
    .nav button { min-height: 44px; padding: 6px 16px; font: 800 15px "Be Vietnam Pro", system-ui; color: #f4ead2; background: #262019; border: 0;
      box-shadow: 0 -3px 0 #0a0807, 0 3px 0 #0a0807, -3px 0 0 #0a0807, 3px 0 0 #0a0807; cursor: pointer; }
    .nav button[aria-pressed="true"] { background: #7a4d12; color: #ffc94a; }
    .truck-demo { max-width: 1180px; margin: 0 auto; padding: 0 16px 24px; }
    .truck-demo h3 { margin: 8px 0 4px; font-size: 14px; color: #b9ad93; }
    .truck-box { position: relative; max-width: 420px; background: #8b6a3e; box-shadow: inset 0 0 0 3px #0a0807; }
  </style>
</head>
<body>
  <div class="dev-bar" role="toolbar" aria-label="Công cụ thử">
    <strong>DEV M4</strong>
    <span class="stat" id="devClock"></span>
    <span class="stat" id="devStat"></span>
    <button type="button" data-dev="t" data-ms="60000">+1 ph</button>
    <button type="button" data-dev="t" data-ms="240000">+4 ph</button>
    <button type="button" data-dev="t" data-ms="480000">+8 ph</button>
    <button type="button" data-dev="t" data-ms="3600000">+1 giờ</button>
    <button type="button" data-dev="t" data-ms="14400000">+4 giờ</button>
    <button type="button" data-dev="more" aria-expanded="false">Thêm…</button>
    <div class="dev-more" id="devMore" hidden>
      <label>Cấp <select id="devLevel"></select></label>
      <button type="button" data-dev="coins">+500 xu</button>
      <button type="button" data-dev="feed">+10 thức ăn</button>
      <button type="button" data-dev="goods">+ bánh trứng / sữa / bột gạo / lúa</button>
      <button type="button" data-dev="coop">Chuồng gà ↑</button>
      <button type="button" data-dev="barn">Chuồng bò ↑</button>
      <button type="button" data-dev="tut" aria-pressed="true">Hướng dẫn M1 xong</button>
      <button type="button" data-dev="ev" data-ev="harvest">Sự kiện: thu 20 lúa</button>
      <button type="button" data-dev="ev" data-ev="deliverEgg">Sự kiện: giao đơn có trứng</button>
      <button type="button" data-dev="ev" data-ev="job">Sự kiện: nhận 5 mẻ Xưởng</button>
      <button type="button" data-dev="ev" data-ev="sell">Sự kiện: bán 25 món</button>
      <button type="button" data-dev="reset">Làm lại</button>
    </div>
  </div>
  <nav class="nav" aria-label="Khu">
    <button type="button" data-scene="animals" aria-pressed="true">Chăn nuôi</button>
    <button type="button" data-scene="village" aria-pressed="false">Làng</button>
  </nav>
  <main id="m4main"></main>
  <section class="truck-demo" aria-label="Xe giao hàng (thử)">
    <h3>Xe giao hàng (ui/truck.js) — bấm “Sự kiện: giao đơn có trứng” (cần cấp ≥ 11)</h3>
    <div class="truck-box" id="truckBox"></div>
  </section>
  <script type="module" src="./dev-m4.js?v=m18"></script>
</body>
</html>
