<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lụm Kèo — Rủ bạn vào chơi</title>
  <meta name="description" content="Lụm Kèo — rủ bạn vào chơi Cờ Cá Ngựa, Cờ Caro, Đào Vàng và nhiều game miễn phí ngay trên trình duyệt, không cần tải." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Roboto+Slab:wght@700;800&display=swap&subset=vietnamese" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/ui/icon-xuc-xac-6.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip" href="#games">Bỏ qua, tới danh sách game</a>

  <!-- HEADER: logo + slogan · tìm game. Tạo phòng / Vào phòng bằng mã chỉ có MỘT chỗ: khung Sảnh chờ trực tiếp. -->
  <header class="topbar" data-name="topbar">
    <div class="topbar__inner">
      <a class="logo" href="./" aria-label="Lụm Kèo — Rủ bạn vào chơi. Về trang chủ">
        <img class="logo__mark" src="assets/ui/icon-xuc-xac-6.png" alt="" width="32" height="32" />
        <span class="logo__words"><span class="logo__text">Lụm Kèo</span><span class="logo__slogan">Rủ bạn vào chơi</span></span>
      </a>

      <label class="field search" for="q">
        <svg class="px-svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 1h5v1H5zM3 2h2v1H3zM10 2h2v1h-2zM2 3h1v2H2zM12 3h1v2h-1zM1 5h1v5H1zM13 5h1v5h-1zM2 10h1v2H2zM12 10h1v1h-1zM3 12h2v1H3zM10 11h2v1h-2zM5 13h5v1H5zM11 12h2v1h-2zM12 13h2v1h-2zM13 14h2v1h-2z"/></svg>
        <span class="sr-only">Tìm game</span>
        <input id="q" type="search" placeholder="Tìm game…" autocomplete="off" enterkeyhint="search" />
      </label>

    </div>
  </header>

  <main class="page">
    <!-- Mobile: ô tìm kiếm nằm đầu trang để thanh trên chỉ 1 hàng -->
    <div class="mobile-search-slot" id="mobileSearchSlot"></div>

    <!-- TẦNG 1: Hero trượt nhiều game (gọn, bên trái) + Sảnh chờ trực tiếp (rộng, bên phải) -->
    <section class="arena" id="featuredSection" data-name="arena" aria-label="Game nổi bật và sảnh chờ">
      <div id="featured" class="arena__hero">
        <div class="hero px-panel" role="region" aria-roledescription="băng chuyền" aria-label="Game nổi bật" data-name="hero">
          <div class="hero__viewport"><div class="hero__track" id="heroTrack" aria-live="off"></div></div>
          <button class="hero__nav hero__nav--prev" id="heroPrev" type="button" aria-label="Game trước"><svg class="px-svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2h2v2h-2zM8 4h2v2H8zM6 6h2v4H6zM8 10h2v2H8zM10 12h2v2h-2z"/></svg></button>
          <button class="hero__nav hero__nav--next" id="heroNext" type="button" aria-label="Game tiếp theo"><svg class="px-svg" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h2v2H4zM6 4h2v2H6zM8 6h2v4H8zM6 10h2v2H6zM4 12h2v2H4z"/></svg></button>
          <div class="hero__dots" id="heroDots" role="group" aria-label="Chọn game nổi bật"></div>
        </div>
      </div>

      <aside class="lobby px-panel" data-name="lobby" aria-labelledby="lobbyTitle">
        <div class="lobby__head">
          <h2 class="lobby__title" id="lobbyTitle"><span class="live" aria-hidden="true"></span>Sảnh chờ trực tiếp</h2>
        </div>

        <div class="lobby__bar">
          <form class="pin" id="roomInline" novalidate data-name="room-inline">
            <div class="pin__head">
              <label class="pin__label" for="roomInlineCode">Có mã phòng bạn gửi?</label>
              <p class="pin__error" id="roomInlineError" role="alert"></p>
            </div>
            <div class="pin__row">
              <input class="field pin__input" id="roomInlineCode" autocomplete="off" spellcheck="false" autocapitalize="characters"
                     maxlength="5" placeholder="ABC78" aria-label="Mã phòng" aria-describedby="roomInlineError" />
              <button class="btn btn--teal" type="submit">Vào phòng</button>
            </div>
            <div id="roomMatches" class="pin__matches"></div>
          </form>
          <a class="btn btn--teal lobby__create" href="#duel" id="createRoom"><span class="btn__plus" aria-hidden="true">+</span>Tạo phòng mới</a>
        </div>

        <div class="lobby__subrow">
          <h3 class="lobby__sub">Phòng công khai đang chờ <span class="count" id="roomCount"></span></h3>
        </div>
        <ul class="rooms" id="rooms"></ul>

        <p class="lobby__note" id="roomStatus" role="status">Đang tải danh sách phòng…</p>
      </aside>
    </section>

    <!-- TẦNG 2: Kho game theo danh mục (mọi kệ cùng một kiểu lưới 6 ô/dòng; tab lọc = đúng các kệ) -->
    <section class="shelves" id="games" data-name="games" aria-labelledby="gamesTitle">
      <div class="shelves__head">
        <h2 class="section__title" id="gamesTitle">Tất cả game <span class="count" id="count"></span></h2>
        <nav class="tabs" id="chips" aria-label="Lọc game theo loại" data-name="filters"></nav>
      </div>
      <div id="grid"></div>
      <p class="empty" id="empty" hidden>Không tìm thấy game nào. <button class="link" id="clearSearch" type="button">Xem tất cả game</button></p>
    </section>
  </main>

  <!-- TẦNG 3: Footer -->
  <footer class="footer" data-name="footer">
    <div class="footer__inner">
      <div class="footer__row">
        <p class="footer__brand"><strong>Lụm Kèo</strong> · Rủ bạn vào chơi · © 2026</p>
        <button class="btn btn--sm" id="soundBtn" type="button" aria-pressed="false">
          <img id="soundIc" src="assets/ui/icon-am-thanh-bat.png" alt="" width="16" height="16" /><span id="soundTx">Âm thanh: bật</span>
        </button>
      </div>
    </div>
  </footer>

  <script src="games.js?v=live1"></script>
  <script src="app.js?v=live1"></script>
  <script type="module" src="../games/_shared/feedback.js"></script>
</body>
</html>
