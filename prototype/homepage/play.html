<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đang mở game — Lụm Kèo</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Roboto+Slab:wght@700;800&display=swap&subset=vietnamese" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%224%22 fill=%22%2311171c%22/%3E%3Cpath d=%22M6 11h4M8 9v4M15 12h.01M18 10h.01M17.3 5H6.7a4 4 0 0 0-4 3.6L2 15.4A3 3 0 0 0 5 19c1 0 1.9-.5 2.4-1.3L9 15h6l1.6 2.7c.5.8 1.4 1.3 2.4 1.3a3 3 0 0 0 3-3.6l-.7-6.8A4 4 0 0 0 17.3 5Z%22 fill=%22none%22 stroke=%22%23ffd27a%22 stroke-width=%222%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .stub { max-width: 640px; margin: 40px auto; padding: 0 16px; text-align: center; }
    .stub .card { pointer-events: none; max-width: 420px; margin: 0 auto 20px; }
    .stub p { color: var(--ink-soft); }
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar__inner" style="grid-template-columns:auto 1fr">
    <a class="logo" href="./"><img class="logo__mark" src="assets/ui/icon-xuc-xac-6.png" alt="" width="32" height="32" /><span class="logo__words"><span class="logo__text">Lụm Kèo</span><span class="logo__slogan">Rủ bạn vào chơi</span></span></a>
  </div></header>
  <main class="stub">
    <h1 id="title" style="font-family:var(--font-title)">Đang mở game…</h1>
    <div id="slot"></div>
    <p id="note">Màn chơi chưa được làm trong bản prototype trang chủ. Trang này chỉ để kiểm tra luồng: chọn game → mở trang chơi.</p>
    <a class="btn btn--gold" href="./">← Về trang chủ</a>
  </main>
  <script src="games.js"></script>
  <script>
    var p = new URLSearchParams(location.search), id = p.get("game"), room = p.get("room");
    var g = (window.GAMES || []).filter(function (x) { return x.id === id; })[0];
    var t = document.getElementById("title");
    if (g && g.url) { location.replace(g.url); }  // link cũ play.html?game=… của game đã có bản chơi thật
    if (g) {
      t.textContent = g.name;
      document.title = g.name + " — Lụm Kèo";
      if (g.thumb) document.getElementById("slot").innerHTML = '<div class="card frame"><span class="pick__art"><img src="' + g.thumb + '" alt=""></span></div>';
    } else if (room && /^[A-Z0-9]{6}$/.test(room)) {
      t.textContent = "Phòng " + room;
      document.getElementById("note").textContent = "Sảnh chờ (lobby) chưa nằm trong phạm vi lần này. Trang này chỉ xác nhận mã phòng được chuyển đúng.";
    } else {
      t.textContent = "Không tìm thấy game";
    }
  </script>
</body>
</html>
